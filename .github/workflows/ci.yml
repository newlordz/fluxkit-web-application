name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # `api/` is in the tsconfig include, so the serverless handlers are
      # typechecked here too and not only when Vite happens to import them.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # The suite is unit-level (VM harness + stubbed fetch): no database,
      # no provider keys, no network calls are required.
      - name: Tests
        run: npm test
